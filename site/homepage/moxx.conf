# =============================================================
# moxx.cn 站点配置
#   moxx.cn         → 个人主页（静态 /var/www/home）
#   www.moxx.cn     → 301 到 moxx.cn
#   write.moxx.cn   → 墨写（Next.js :3000 + FastAPI :8010）
#   3d.moxx.cn      → 图生3D（Express :4310，带访问口令）
# =============================================================

# ---------- HTTP：全站跳 HTTPS（并保留 ACME 验证路径）----------
server {
    listen 80;
    server_name moxx.cn www.moxx.cn write.moxx.cn 3d.moxx.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- moxx.cn：个人主页（纯静态）----------
server {
    listen 443 ssl http2;
    server_name moxx.cn;

    ssl_certificate     /etc/letsencrypt/live/moxx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moxx.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/home;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}

# ---------- www.moxx.cn：统一跳到主域 ----------
server {
    listen 443 ssl http2;
    server_name www.moxx.cn;

    ssl_certificate     /etc/letsencrypt/live/moxx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moxx.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://moxx.cn$request_uri;
}

# ---------- write.moxx.cn：墨写（与迁移前完全一致，仅换域名）----------
server {
    listen 443 ssl http2;
    server_name write.moxx.cn;

    ssl_certificate     /etc/letsencrypt/live/moxx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moxx.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- 3d.moxx.cn：图生3D（访问口令保护）----------
server {
    listen 443 ssl http2;
    server_name 3d.moxx.cn;

    ssl_certificate     /etc/letsencrypt/live/moxx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moxx.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 参考图上限 30MB（服务端 imageRules.maxBytes），留一点余量
    client_max_body_size 40m;

    auth_basic           "Seed3D Demo";
    auth_basic_user_file /etc/nginx/.htpasswd-3d;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 模型下载与轮询可能较慢，放宽超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;
    }
}
